<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Outer Crest Shield with Scalloped Edge -->
  <path d="M 210,18 
           C 255,18 290,30 320,50 
           C 355,72 375,105 380,140 
           C 385,180 370,215 375,250 
           C 380,290 358,325 325,350 
           C 288,380 248,390 210,392 
           C 172,390 132,380 95,350 
           C 62,325 40,290 45,250 
           C 50,215 35,180 40,140 
           C 45,105 65,72 100,50 
           C 130,30 165,18 210,18 Z" 
        fill="#FFFFFF" 
        stroke="url(#gold-grad)" 
        stroke-width="11" 
        filter="url(#drop-shadow)" />

  <!-- Inner Gold Beaded Border -->
  <path d="M 210,27 
           C 248,27 280,38 310,57 
           C 340,76 360,105 365,138 
           C 370,174 356,206 361,239 
           C 366,275 346,307 317,332 
           C 283,360 246,370 210,372 
           C 174,370 137,360 103,332 
           C 74,307 54,275 59,239 
           C 64,206 50,174 55,138 
           C 60,105 80,76 110,57 
           C 140,38 172,27 210,27 Z" 
        fill="#FFFDF7" 
        stroke="#B45309" 
        stroke-width="3" 
        stroke-dasharray="5,4" />

  <!-- DKW Top Text -->
  <text x="210" y="112" 
        text-anchor="middle" 
        font-family="Impact, 'Arial Black', sans-serif" 
        font-size="70" 
        font-weight="900" 
        letter-spacing="4" 
        fill="url(#red-grad)" 
        stroke="#FDE047" 
        stroke-width="2.5" 
        stroke-linejoin="round">DKW</text>
  
  <!-- TM Symbol -->
  <text x="288" y="78" 
        font-family="sans-serif" 
        font-size="14" 
        font-weight="900" 
        fill="#78350F">TM</text>

  <!-- Hindi Brand Text: दिल्ली (Delhi) -->
  <g id="hindi-text" filter="url(#drop-shadow)">
    <text x="210" y="196" 
          text-anchor="middle" 
          font-family="'Noto Sans Devanagari', 'Yatra One', 'Arial Unicode MS', 'Mangal', sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="1"
          fill="url(#red-grad)" 
          stroke="#FEF08A" 
          stroke-width="2.5"
          stroke-linejoin="round">दिल्ली</text>

    <!-- Hindi Brand Text: कोल्हू वाले (Kolhu Wale) -->
    <text x="210" y="272" 
          text-anchor="middle" 
          font-family="'Noto Sans Devanagari', 'Yatra One', 'Arial Unicode MS', 'Mangal', sans-serif" 
          font-size="52" 
          font-weight="900" 
          letter-spacing="0.5"
          fill="url(#red-grad)" 
          stroke="#FEF08A" 
          stroke-width="2.5"
          stroke-linejoin="round">कोल्हू वाले</text>
  </g>

  <!-- Bottom Arch Ribbon for 'PURE OIL & DESI GHEE' -->
  <path d="M 92,306 Q 210,332 328,306 L 322,338 Q 210,364 98,338 Z" 
        fill="url(#ribbon-grad)" 
        stroke="#FDE047" 
        stroke-width="2" />
  
  <text x="210" y="327" 
        text-anchor="middle" 
        font-family="Impact, 'Arial Black', sans-serif" 
        font-size="13" 
        font-weight="900" 
        letter-spacing="2.5" 
        fill="#FEF08A">★ PURE OIL &amp; DESI GHEE ★</text>
</svg>
